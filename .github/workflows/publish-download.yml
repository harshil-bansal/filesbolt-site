# Publishes a new Windows installer.
# 1. Push FilesBolt-Setup-<version>.exe (and optionally NOTES.txt) to the "incoming" branch.
# 2. Run this workflow. It creates the release (with a stable FilesBolt-Setup.exe for the website
#    button), writes version.json for the app's auto-updater, updates the version shown on the
#    website, and removes the incoming branch.
name: Publish download
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: incoming
          path: incoming
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Find installer
        id: f
        working-directory: incoming
        run: |
          f=$(ls FilesBolt-Setup-*.exe | head -1)
          v=${f#FilesBolt-Setup-}; v=${v%.exe}
          cp "$f" FilesBolt-Setup.exe
          size=$(stat -c %s "$f")
          sha=$(sha256sum "$f" | cut -d' ' -f1)
          notes=""; [ -f NOTES.txt ] && notes=$(cat NOTES.txt)
          echo "file=$f" >> $GITHUB_OUTPUT
          echo "ver=$v" >> $GITHUB_OUTPUT
          echo "size=$size" >> $GITHUB_OUTPUT
          echo "sha=$sha" >> $GITHUB_OUTPUT
          { echo "notes<<EOF_NOTES"; echo "$notes"; echo "EOF_NOTES"; } >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.f.outputs.ver }}
          target_commitish: main
          name: FilesBolt ${{ steps.f.outputs.ver }}
          body: |
            FilesBolt for Windows 10 and 11. Download **FilesBolt-Setup.exe** and run it.

            ${{ steps.f.outputs.notes }}
          make_latest: true
          files: |
            incoming/${{ steps.f.outputs.file }}
            incoming/FilesBolt-Setup.exe
      - name: Update version.json and the website
        working-directory: site
        env:
          VER: ${{ steps.f.outputs.ver }}
          SIZE: ${{ steps.f.outputs.size }}
          SHA: ${{ steps.f.outputs.sha }}
          FILE: ${{ steps.f.outputs.file }}
          NOTES: ${{ steps.f.outputs.notes }}
        run: |
          python3 - <<'PY'
          import json, os, re
          v, size = os.environ["VER"], int(os.environ["SIZE"])
          info = {
              "version": v,
              "url": f"https://github.com/${{ github.repository }}/releases/download/v{v}/{os.environ['FILE']}",
              "size": size,
              "sha256": os.environ["SHA"],
              "notes": os.environ.get("NOTES", "").strip(),
          }
          open("version.json", "w").write(json.dumps(info, indent=2) + "\n")
          s = open("index.html").read()
          s = re.sub(r"<dd data-ver>[^<]*</dd>", f"<dd data-ver>{v}</dd>", s)
          s = re.sub(r"<dd data-size>[^<]*</dd>", f"<dd data-size>{round(size / 1048576)} MB</dd>", s)
          open("index.html", "w").write(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json index.html
          git commit -m "Publish FilesBolt $VER" || echo "nothing to commit"
          git push
      - name: Remove the incoming branch
        working-directory: site
        run: git push origin --delete incoming
