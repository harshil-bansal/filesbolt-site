# Publishes a new Android APK.
# 1. Push FilesBolt-<version>.apk (and optionally NOTES.txt) to the "incoming-android" branch.
# 2. Run this workflow. It creates the release android-v<version> (with a stable FilesBolt.apk for the
#    website button) and writes android.json, which the app's updater reads.
name: Publish Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: incoming-android
          path: incoming
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Find APK
        id: f
        working-directory: incoming
        run: |
          f=$(ls FilesBolt-*.apk | head -1)
          v=${f#FilesBolt-}; v=${v%.apk}
          cp "$f" FilesBolt.apk
          echo "file=$f" >> $GITHUB_OUTPUT
          echo "ver=$v" >> $GITHUB_OUTPUT
          echo "size=$(stat -c %s "$f")" >> $GITHUB_OUTPUT
          echo "sha=$(sha256sum "$f" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          notes=""; [ -f NOTES.txt ] && notes=$(cat NOTES.txt)
          d="EOF_$(openssl rand -hex 16)"; { echo "notes<<$d"; echo "$notes"; echo "$d"; } >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.f.outputs.ver }}
          target_commitish: main
          name: FilesBolt for Android ${{ steps.f.outputs.ver }}
          body: FilesBolt for Android (beta). Download **FilesBolt.apk** on your phone and open it.
          prerelease: true
          make_latest: false
          files: |
            incoming/${{ steps.f.outputs.file }}
            incoming/FilesBolt.apk
      - name: Write android.json
        working-directory: site
        env:
          VER: ${{ steps.f.outputs.ver }}
          SIZE: ${{ steps.f.outputs.size }}
          SHA: ${{ steps.f.outputs.sha }}
          FILE: ${{ steps.f.outputs.file }}
          NOTES: ${{ steps.f.outputs.notes }}
        run: |
          python3 - <<'PY'
          import json, os
          v = os.environ["VER"]; a, b, c = (int(x) for x in v.split("."))
          info = {"version": v, "code": a * 10000 + b * 100 + c,
                  "url": f"https://github.com/${{ github.repository }}/releases/download/android-v{v}/{os.environ['FILE']}",
                  "size": int(os.environ["SIZE"]), "sha256": os.environ["SHA"], "notes": os.environ.get("NOTES", "").strip()}
          open("android.json", "w").write(json.dumps(info, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android.json
          git commit -m "Publish FilesBolt for Android $VER" || echo "nothing to commit"
          git push
      - name: Remove the incoming-android branch
        working-directory: site
        run: git push origin --delete incoming-android || true
