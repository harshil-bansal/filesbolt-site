# Keeps the free Supabase project (FilesBolt accounts) from pausing after a week without activity.
# Calls a harmless public function every two days. The publishable key is public by design.
name: Keep accounts server awake
on:
  schedule:
    - cron: "17 9 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/r -w "%{http_code}" -X POST \
              "https://aovtkaljtayxuxuzureh.supabase.co/rest/v1/rpc/ping" \
              -H "apikey: sb_publishable_qK3cBBkyFVLg7FKiLfiYFQ_Q7Ss2Sf9" \
              -H "Content-Type: application/json" -d '{}')
            echo "HTTP $code: $(cat /tmp/r)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
