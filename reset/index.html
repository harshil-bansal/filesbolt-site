<main class="doc">
  <div class="wrap narrow">
    <h1>Choose a new password</h1>
    <p id="rMsg">Checking your link…</p>
    <form id="rf" hidden style="margin-top:12px;display:grid;gap:14px;max-width:420px">
      <label>New password<br><input id="rP1" type="password" autocomplete="new-password" minlength="8" maxlength="72" required style="width:100%;padding:10px;border:1px solid #CBD0D8;border-radius:8px;font:inherit"></label>
      <label>Type it again<br><input id="rP2" type="password" autocomplete="new-password" minlength="8" maxlength="72" required style="width:100%;padding:10px;border:1px solid #CBD0D8;border-radius:8px;font:inherit"></label>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rShow"> Show password</label>
      <p class="muted" style="font-size:14px;margin:0">At least 8 characters. You'll be signed out on every PC, then sign in again with the new password.</p>
      <p><button class="btn" type="submit" id="rGo">Save new password</button></p>
      <p id="rDone" role="status"></p>
    </form>
    <script>
      (function () {
        var U = "https://aovtkaljtayxuxuzureh.supabase.co/rest/v1/rpc/", K = "sb_publishable_qK3cBBkyFVLg7FKiLfiYFQ_Q7Ss2Sf9";
        var t = new URLSearchParams(location.search).get("t") || "";
        var m = document.getElementById("rMsg"), f = document.getElementById("rf"), d = document.getElementById("rDone"), b = document.getElementById("rGo");
        history.replaceState(null, "", location.pathname);  // keep the link out of the address bar and history
        // Free HaveIBeenPwned check: only the first 5 characters of the SHA-1 hash leave this page.
        function leaked(pw) {
          if (!window.crypto || !crypto.subtle) return Promise.resolve(false);
          return crypto.subtle.digest("SHA-1", new TextEncoder().encode(pw)).then(function (buf) {
            var h = Array.from(new Uint8Array(buf)).map(function (x) { return ("0" + x.toString(16)).slice(-2); }).join("").toUpperCase();
            return fetch("https://api.pwnedpasswords.com/range/" + h.slice(0, 5), { headers: { "Add-Padding": "true" } })
              .then(function (r) { return r.ok ? r.text() : ""; })
              .then(function (t) { return t.split("\n").some(function (l) { var p = l.trim().split(":"); return p[0] === h.slice(5) && p[1] && p[1] !== "0"; }); });
          }).catch(function () { return false; });
        }
        function call(fn, body) {
          return fetch(U + fn, { method: "POST", headers: { apikey: K, "Content-Type": "application/json" }, body: JSON.stringify(body) })
            .then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); });
        }
        if (!t) { m.textContent = "Open this page from the link in your FilesBolt email. Or use \u201cForgot password?\u201d in the app."; return; }
        call("reset_link_status", { t: t }).then(function (r) {
          if (!r || !r.ok) { m.textContent = "This link has expired or was already used. Use \u201cForgot password?\u201d in FilesBolt, or contact us at filesbolt.com/contact."; return; }
          m.textContent = "Choose a new password for " + r.email + "."; f.hidden = false; document.getElementById("rP1").focus();
        }).catch(function () { m.textContent = "We couldn't reach the server. Check your connection and open the link again."; });
        document.getElementById("rShow").addEventListener("change", function (e) {
          document.getElementById("rP1").type = document.getElementById("rP2").type = e.target.checked ? "text" : "password"; });
        f.addEventListener("submit", function (ev) {
          ev.preventDefault();
          var p1 = document.getElementById("rP1").value, p2 = document.getElementById("rP2").value;
          if (p1.length < 8) { d.textContent = "Use at least 8 characters."; return; }
          if (p1 !== p2) { d.textContent = "The two passwords don't match."; return; }
          b.disabled = true; d.textContent = "Saving…";
          leaked(p1).then(function (bad) {
          if (bad) { b.disabled = false; d.textContent = "This password has shown up in a data breach on another website, so it isn't safe. Please choose a different one."; return; }
          call("reset_password_with_link", { t: t, new_password: p1 }).then(function (r) {
            if (r && r.ok) { f.hidden = true; m.textContent = "Done. Your password is changed. Open FilesBolt and sign in with your new password."; }
            else { d.textContent = (r && r.message) || "That didn't work. Please try again."; b.disabled = false; }
          }).catch(function () { d.textContent = "We couldn't reach the server. Please try again."; b.disabled = false; });
          });
        });
      })();
    </script>
