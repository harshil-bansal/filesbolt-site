<main class="doc">
  <div class="wrap narrow">
    <h1>Email preferences</h1>
    <p id="unsubMsg">Loading your choices…</p>
    <form id="prefs" hidden style="margin-top:8px">
      <label style="display:flex;gap:10px;align-items:flex-start;margin:14px 0"><input type="checkbox" id="pTips" style="margin-top:4px">
        <span><b>Tips, news and offers</b><br><span class="muted">New tools, how-tos and the occasional offer.</span></span></label>
      <label style="display:flex;gap:10px;align-items:flex-start;margin:14px 0"><input type="checkbox" id="pMonthly" style="margin-top:4px">
        <span><b>Monthly summary</b><br><span class="muted">How much you did with FilesBolt last month and the time it saved you.</span></span></label>
      <label style="display:flex;gap:10px;align-items:flex-start;margin:14px 0"><input type="checkbox" id="pTrial" style="margin-top:4px">
        <span><b>Plan reminders</b><br><span class="muted">A heads-up before your free time or plan ends.</span></span></label>
      <p class="muted" style="font-size:14px">Account and security emails, like sign-in codes, always arrive.</p>
      <p style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" type="submit" id="pSave">Save my choices</button>
        <button class="btn btn-ghost" type="button" id="pNone">Unsubscribe from all</button>
      </p>
      <p id="pDone" role="status"></p>
    </form>
    <script>
      (function () {
        var U = "https://aovtkaljtayxuxuzureh.supabase.co/rest/v1/rpc/", K = "sb_publishable_qK3cBBkyFVLg7FKiLfiYFQ_Q7Ss2Sf9";
        var q = new URLSearchParams(location.search), e = q.get("e"), t = q.get("t");
        try { history.replaceState(null, "", location.pathname); } catch (_) {}
        var m = document.getElementById("unsubMsg"), f = document.getElementById("prefs"), d = document.getElementById("pDone");
        var box = { tips: document.getElementById("pTips"), monthly: document.getElementById("pMonthly"), trial: document.getElementById("pTrial") };
        function call(fn, body) {
          return fetch(U + fn, { method: "POST", headers: { apikey: K, "Content-Type": "application/json" }, body: JSON.stringify(body) })
            .then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); });
        }
        if (!e || !t) { m.textContent = "Open this page from the link at the bottom of a FilesBolt email, or change your choices in the app: Settings > Account."; return; }
        call("email_prefs_by_token", { e: e, t: t }).then(function (r) {
          if (!r || !r.ok) { m.textContent = "That link didn't work. Email support@filesbolt.com and we'll change your choices for you."; return; }
          m.textContent = "Choose which emails " + e + " gets.";
          box.tips.checked = r.tips; box.monthly.checked = r.monthly; box.trial.checked = r.trial;
          f.hidden = false;
        }).catch(function () { m.textContent = "We couldn't reach the server. Check your connection and open the link again."; });
        function save(all) {
          if (all) { box.tips.checked = box.monthly.checked = box.trial.checked = false; }
          d.textContent = "Saving…";
          call("set_email_prefs_by_token", { e: e, t: t, tips: box.tips.checked, monthly: box.monthly.checked, trial: box.trial.checked })
            .then(function (ok) { d.textContent = ok === true ? (all ? "Done. You're unsubscribed from all of these emails." : "Saved.") : "That didn't work. Please try again."; })
            .catch(function () { d.textContent = "We couldn't reach the server. Please try again."; });
        }
        f.addEventListener("submit", function (ev) { ev.preventDefault(); save(false); });
        document.getElementById("pNone").addEventListener("click", function () { save(true); });
      })();
    </script>
  </div>
</main>
